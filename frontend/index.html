<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafka Q&A automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 min-h-screen text-gray-900 font-sans">
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-indigo-600">Kafka Q&A automation</span>
                </div>
                <div class="flex items-center space-x-4">
                    <div id="api-status" class="flex items-center">
                        <span class="h-2 w-2 rounded-full bg-yellow-400 mr-2"></span>
                        <span class="text-sm text-gray-500">Checking API...</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-10 px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Sidebar / Upload -->
            <div class="space-y-6">
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <h2 class="text-lg font-semibold mb-4">Step 1: Upload Document</h2>
                    <p class="text-sm text-gray-600 mb-4">Upload a text or PDF file to start the RAG indexing process.</p>
                    
                    <form id="upload-form" class="space-y-4">
                        <div class="flex items-center justify-center w-full">
                            <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
                                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                    <svg class="w-8 h-8 mb-4 text-gray-500" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                                    </svg>
                                    <p class="mb-2 text-sm text-gray-500"><span class="font-semibold">Click to upload</span></p>
                                    <p class="text-xs text-gray-500">TXT or PDF (MAX. 5MB)</p>
                                </div>
                                <input id="dropzone-file" type="file" class="hidden" accept=".txt,.pdf" />
                            </label>
                        </div>
                        <div id="file-selected" class="hidden text-sm text-indigo-600 font-medium"></div>
                        <button type="submit" id="upload-btn" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors disabled:opacity-50">
                            Index Document
                        </button>
                    </form>
                    <div id="upload-status" class="mt-4 hidden"></div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <h2 class="text-lg font-semibold mb-2">System Stats</h2>
                    <div id="stats" class="space-y-2">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Indexed Docs:</span>
                            <span id="stat-docs" class="font-medium">0</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-500">Total Chunks:</span>
                            <span id="stat-chunks" class="font-medium">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Panel / Question -->
            <div class="md:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                    <h2 class="text-lg font-semibold mb-4">Step 2: Ask a Question</h2>
                    <form id="question-form" class="space-y-4">
                        <div>
                            <textarea id="question-input" rows="3" class="w-full border-gray-300 border p-3 rounded-md focus:ring-indigo-500 focus:border-indigo-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md" placeholder="Ask anything about the uploaded documents..."></textarea>
                        </div>
                        <button type="submit" id="ask-btn" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-colors disabled:opacity-50">
                            Ask Agents
                        </button>
                    </form>
                </div>

                <div id="results-container" class="space-y-4">
                    <!-- Responses will be injected here -->
                    <div id="no-results" class="bg-gray-50 border-2 border-dashed border-gray-200 rounded-lg py-12 text-center text-gray-500">
                        Ask a question to see agent reasoning and answers here.
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Templates -->
    <template id="response-template">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden animate-fade-in">
            <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <div class="h-8 w-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold text-xs">
                        QA
                    </div>
                    <div>
                        <h3 class="text-sm font-medium text-gray-900 response-question"></h3>
                        <p class="text-xs text-gray-500 response-time"></p>
                    </div>
                </div>
                <div class="response-status text-xs font-medium px-2 py-1 rounded-full"></div>
            </div>
            <div class="p-6">
                <div class="flex items-start space-x-3 mb-4">
                    <div class="flex-shrink-0 pt-0.5">
                        <span class="text-indigo-600 font-bold text-sm">A:</span>
                    </div>
                    <div class="text-gray-800 leading-relaxed response-answer whitespace-pre-wrap italic text-gray-400">
                        Processing...
                    </div>
                </div>
                <div class="response-sources hidden mt-4 pt-4 border-t border-gray-100">
                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">Sources Used</h4>
                    <div class="flex flex-wrap gap-2 response-source-tags"></div>
                </div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
